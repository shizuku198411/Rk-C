name: rkcdev
base: ubuntu@24.04

sdks:
  - name: nim-toolchain
    channel: latest/stable
  
  - name: project-rkc-base
  
  - name: system
    plugs:
      gdb:
        interface: tunnel
        endpoint: localhost:1234    # host side port

actions:
  build: |
    set -eux
    cd /project
    make build

  build-bins: |
    set -eux
    cd /project
    make build-bins

  test: |
    set -eux
    cd /project
    make test-apps TEST_APPS_ARGS="--boot-timeout 60 --command-recover-timeout 30 --qemu-net user --skip-network-smoke"

  run: |
    set -eux
    cd /project
    make run

  debug: |
    set -eux
    cd /project
    make qemu-debug

  clean: |
    set -eux
    cd /project
    make clean
