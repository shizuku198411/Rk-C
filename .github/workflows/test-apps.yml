name: App Smoke Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-apps:
    name: QEMU app smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check WORKSHOP_TOKEN
        if: ${{ !env.ACT }}
        shell: bash
        run: |
          if [ -z "${WORKSHOP_TOKEN}" ]; then
            echo "WORKSHOP_TOKEN is empty"
            exit 1
          fi
          echo "WORKSHOP_TOKEN is set"
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Check token access to canonical/workshop
        if: ${{ !env.ACT }}
        shell: bash
        run: |
          status="$(
            curl -sS -o /tmp/workshop-repo.json -w '%{http_code}' \
              -H "Authorization: Bearer ${WORKSHOP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/canonical/workshop
          )"
          echo "GitHub API status: ${status}"
          if [ "${status}" != "200" ]; then
            cat /tmp/workshop-repo.json
            exit 1
          fi
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Workshop Checkout
        if: ${{ !env.ACT }}
        uses: canonical/launch-workshop@v0
        with:
          token: ${{ secrets.WORKSHOP_TOKEN }}
          workshop: rkc-dev

      - name: Test on Workshop
        if: ${{ !env.ACT }}
        run: workshop run rkc-dev -- test

      - name: Skip Workshop test in local act
        if: ${{ env.ACT }}
        shell: bash
        run: |
          set -eux
          echo "Skipping Workshop-based QEMU smoke test under local act."
          echo "This local act run validates the workflow wiring only."
          echo "Run the actual test with: workshop run rkc-dev -- test"

      - name: Upload QEMU log
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: qemu-test-log
          path: build/test_apps_qemu.log
          if-no-files-found: ignore

      - name: Upload test summary
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: qemu-test-summary
          path: build/test_apps_summary.json
          if-no-files-found: ignore
