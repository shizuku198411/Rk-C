name: App Smoke Tests

on:
  pull_request:

jobs:
  test-apps:
    name: QEMU app smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Workshop Checkout
        uses: canonical/launch-workshop@v0
        with:
          token: ${{ secrets.WORKSHOP_TOKEN }}
      
      - name: Test on Workshop
        run: workshop run -- test

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-log
          path: build/test_apps_qemu.log
          if-no-files-found: ignore