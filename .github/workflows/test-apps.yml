name: App Smoke Tests

on:
  pull_request:

jobs:
  test-apps:
    name: QEMU app smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            curl \
            lld \
            llvm \
            make \
            opensbi \
            python3 \
            qemu-system-misc

      - name: Install Nim 2.2.10
        run: |
          curl -L https://nim-lang.org/download/nim-2.2.10-linux_x64.tar.xz -o /tmp/nim.tar.xz
          tar -xf /tmp/nim.tar.xz -C "$HOME"
          "$HOME/nim-2.2.10/bin/nim" --version

      - name: Run app smoke tests
        run: |
          make test-apps \
            OPENSBI_FW="${{ steps.opensbi.outputs.fw }}" \
            TEST_APPS_ARGS="--boot-timeout 60 --command-recover-timeout 30 --qemu-net user --skip-network-smoke --allowed-failures 4"

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-log
          path: build/test_apps_qemu.log
          if-no-files-found: ignore
